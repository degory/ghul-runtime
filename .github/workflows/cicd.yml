name: CICD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true

  pull_request:

  push:
    branches:
      - "main"
env:
  CI: true

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '0'

    # Compute the next version: the patch bump of the latest vX.Y.Z tag, unless
    # the checked-in VERSION file declares a higher minor/major floor. VERSION
    # is code-owned, so raising it for a non-patch release requires the code
    # owner's review (a #major/#minor marker can no longer trigger a bump). A
    # workflow_dispatch `version` input overrides outright; pull request builds
    # get a -beta.<run> prerelease so they never collide with a real release.
    - name: Determine the version
      id: version
      uses: degory/create-version@v1.0.0
      with:
        version: ${{ github.event.inputs.version }}
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

  build:
    name: Build package
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-jammy

    timeout-minutes: 10
    needs: [version]

    steps:
    - uses: actions/checkout@v6

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Run tests
      run: dotnet test tests/tests.ghulproj
                    
    - name: Create package
      run: dotnet pack -p:Version=${{ needs.version.outputs.package }}

    - name: Upload package artefact
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: nupkg

  integration-tests:
    name: Test package
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-jammy

    timeout-minutes: 10
    needs: [version,build]

    steps:
    - uses: actions/checkout@v6

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Set version
      run: dotnet setversion ${{ needs.version.outputs.package }} Directory.Build.props

    - name: Build test project
      run: dotnet build
      working-directory: integration-tests

    - name: Run integration test and verify output
      working-directory: integration-tests
      run: |
        STDOUT=$(dotnet run | tr -d '\n\r')
        echo "Output: \"${STDOUT}\""
        test "${STDOUT}" = "Hello ghūl world!"

  code_review:
    needs: [version, build, integration-tests]
    name: Claude code review

    timeout-minutes: 15

    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}

    continue-on-error: true

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Fetch GHUL.md from degory/ghul main
      run: curl -fsSL https://raw.githubusercontent.com/degory/ghul/main/GHUL.md -o GHUL.md

    - uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        allowed_bots: "*"
        prompt: |
          Review pull request #${{ github.event.pull_request.number }} on ${{ github.repository }}.

          CI has already passed for this commit — build, tests, and the integration test against a freshly packed runtime are settled. Don't second-guess validity.

          Read these files first, in order:
          1. .github/claude-review.md — how to operate, severity bar, what to flag
          2. GHUL.md — ghūl language reference, freshly fetched from degory/ghul main (consult as needed while reading the diff)

          The PR branch is already checked out. Useful commands:
          - `gh pr diff ${{ github.event.pull_request.number }}` — the diff
          - `gh pr view ${{ github.event.pull_request.number }} --json title,body` — PR title and description

          Post findings only to GitHub per the brief. Do not put review text in chat messages.
        claude_args: |
          --model claude-sonnet-4-6
          --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Read,Glob,Grep"

  publish-beta-package:
    # for pull requests, only publish the beta package
    name: Publish beta NuGet package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-jammy

    timeout-minutes: 10
    needs: [version,build,integration-tests]

    steps:
    # not convinced we actually need to checkout the code here
    - uses: actions/checkout@v6

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Publish package to GitHub
      run: dotnet nuget push ./nupkg/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/degory/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release-package:
    # For pushes, publish the release package to both GitHub and NuGet
    # Don't need to check the branch here, as push only happens on main
    name: Publish NuGet package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0-jammy

    timeout-minutes: 10
    needs: [version,build,integration-tests]

    steps:
    - uses: actions/checkout@v6

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Publish package to GitHub
      if: ${{ github.actor != 'dependabot[bot]' }}
      run: dotnet nuget push ./nupkg/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/degory/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish package to NuGet
      if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      run: dotnet nuget push ./nupkg/*.nupkg -k ${NUGET_TOKEN} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
      env:
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

  create-release:
    needs: [version, build, integration-tests, publish-release-package]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name == 'push' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '0'

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul.runtime.${{ needs.version.outputs.package }}.nupkg \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt