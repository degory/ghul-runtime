name: CICD

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true

  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
      - "main"

# Serialise pushes to main so two concurrent merges don't compute the same
# version number; for pull requests, cancel any superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  version:
    name: Create a version number
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      package: ${{ steps.version.outputs.package }}

    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '0'

    # Compute the next version: the patch bump of the latest vX.Y.Z tag, unless
    # the checked-in VERSION file declares a higher minor/major floor (a
    # #major/#minor marker can no longer trigger a bump). A workflow_dispatch
    # `version` input overrides outright; pull request builds get a -beta.<run>
    # prerelease so they never collide with a real release.
    - name: Determine the version
      id: version
      uses: ghul-lang/create-version@v1.0.0
      with:
        version: ${{ github.event.inputs.version }}
        prerelease: ${{ github.event_name == 'pull_request' && format('beta.{0}', github.run_number) || '' }}

  build:
    name: Build package
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    timeout-minutes: 10
    needs: [version]

    steps:
    - uses: actions/checkout@v6

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Run tests
      run: dotnet test tests/tests.ghulproj
                    
    - name: Create package
      run: dotnet pack -p:Version=${{ needs.version.outputs.package }}

    - name: Upload package artefact
      uses: actions/upload-artifact@v7
      with:
        name: package
        path: nupkg

  integration-tests:
    name: Test package
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    timeout-minutes: 10
    needs: [version,build]

    steps:
    - uses: actions/checkout@v6

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Set version
      run: dotnet setversion ${{ needs.version.outputs.package }} Directory.Build.props

    - name: Build test project
      run: dotnet build
      working-directory: integration-tests

    - name: Run integration test and verify output
      working-directory: integration-tests
      run: |
        STDOUT=$(dotnet run | tr -d '\n\r')
        echo "Output: \"${STDOUT}\""
        test "${STDOUT}" = "Hello ghūl world!"

    - name: Verify default Debug build produces a PDB
      working-directory: integration-tests
      run: test -f bin/Debug/net10.0/tests.pdb

    - name: Verify DebugType=none suppresses the PDB
      working-directory: integration-tests
      run: |
        rm -rf bin obj
        dotnet build -p:DebugType=none
        if [ -f bin/Debug/net10.0/tests.pdb ]; then
          echo "DebugType=none unexpectedly produced a PDB" >&2
          exit 1
        fi

    - name: Verify DebugSymbols=false suppresses the PDB
      working-directory: integration-tests
      run: |
        rm -rf bin obj
        dotnet build -p:DebugSymbols=false
        if [ -f bin/Debug/net10.0/tests.pdb ]; then
          echo "DebugSymbols=false unexpectedly produced a PDB" >&2
          exit 1
        fi

  # Native AOT needs a platform linker, which the SDK container lacks and the
  # runner image has. Rendering takes a path of its own there, so the same
  # program is run both ways and each has to print run.expected.
  native-aot-tests:
    name: Test package with Native AOT
    runs-on: ubuntu-latest

    timeout-minutes: 15
    needs: [version,build]

    steps:
    - uses: actions/checkout@v6

    - name: Set up .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Set version
      run: dotnet setversion ${{ needs.version.outputs.package }} Directory.Build.props

    - name: Run under the JIT and verify output
      working-directory: native-aot-tests
      run: dotnet run | diff - run.expected

    - name: Publish with Native AOT
      working-directory: native-aot-tests
      run: dotnet publish -r linux-x64 -o out

    - name: Run the Native AOT build and verify output
      working-directory: native-aot-tests
      run: timeout 60 out/native-aot-tests | diff - run.expected

  wasm-tests:
    name: Run wasm tests
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    # A wasm program runs under Node.js, which needs WebAssembly GC: on by
    # default from Node.js 22.
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'

    - name: Restore local .NET tools
      run: dotnet tool restore

    - name: Build and run the wasm tests
      run: dotnet ghul-test --use-ghul-cli --ghul "dotnet ghul" --target wasm wasm-tests

  publish-beta-package:
    # for pull requests, only publish the beta package
    name: Publish beta NuGet package
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    # The organization hands workflows a read-only token by default, so the
    # push to its package feed has to ask for packages: write itself.
    permissions:
      contents: read
      packages: write
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    timeout-minutes: 10
    needs: [version,build,integration-tests,native-aot-tests]

    steps:
    # not convinced we actually need to checkout the code here
    - uses: actions/checkout@v6

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Publish package to GitHub
      run: dotnet nuget push ./nupkg/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release-package:
    # For pushes, publish the release package to both GitHub and NuGet
    # Don't need to check the branch here, as push only happens on main
    name: Publish NuGet package
    runs-on: ubuntu-latest
    # The organization hands workflows a read-only token by default, so the
    # push to its package feed has to ask for packages: write itself.
    permissions:
      contents: read
      packages: write
    if: ${{ github.event_name == 'push' }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble

    timeout-minutes: 10
    needs: [version,build,integration-tests,native-aot-tests]

    steps:
    - uses: actions/checkout@v6

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Publish package to GitHub
      run: dotnet nuget push ./nupkg/*.nupkg -k ${GITHUB_TOKEN} -s https://nuget.pkg.github.com/ghul-lang/index.json --skip-duplicate --no-symbols
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish package to NuGet
      if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
      run: dotnet nuget push ./nupkg/*.nupkg -k ${NUGET_TOKEN} -s https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
      env:
        NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}

  create-release:
    needs: [version, build, integration-tests, native-aot-tests, publish-release-package]
    name: Create release
    runs-on: ubuntu-latest

    timeout-minutes: 5
    if: ${{ github.event_name == 'push' }}

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: '0'

    - name: Download package
      uses: actions/download-artifact@v8
      with:
        name: package
        path: nupkg

    - name: Create changelog
      run: git log -1 --format="%s%n%n%b%n%n" >changelog.txt

    - name: Create a release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.version.outputs.tag }}" \
          ./nupkg/ghul.runtime.${{ needs.version.outputs.package }}.nupkg \
          --title "${{ needs.version.outputs.tag }}" \
          --notes-file changelog.txt
